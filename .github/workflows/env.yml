
pool: devops_agent1

trigger:
- main


resources:
repositories:
- repository: pipeline_templates
type: git
name: Devops_pipeline1/pipeline_templates
ref: refs/heads/main

stages:
- stage: init
displayName: "Terraform Init"
jobs:
- job: init
steps:
- template: init.yml@pipeline_templates
- stage: plan
dependsOn: init
jobs:
- job: plan
steps:
- template: init.yml@pipeline_templates
- template: plan.yml@pipeline_templates
